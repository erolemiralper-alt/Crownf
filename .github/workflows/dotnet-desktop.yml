name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Install Android workload
      run: dotnet workload install android

    - name: Build
      run: dotnet build CrownDriftWatch.csproj -c ${{ matrix.configuration }}

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk-${{ matrix.configuration }}
        path: "**/*.apk"
